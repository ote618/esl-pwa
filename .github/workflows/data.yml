name: build

# P0-E2-S4 — the data gate. A broken join must fail here, not in front of a child.
#
# NOTE FOR WHOEVER COMMITS THIS: this file cannot be added from a Cowork cloud
# chat. The git proxy intercepts github.com and api.github.com regardless of
# authentication (F-32). Add it from Claude Code or the GitHub UI.
#
# Branch protection ("Require status checks to pass before merging" -> select
# `data` and `app`) is a repository SETTING, not a file. It must be switched on
# in the GitHub UI or nothing here actually blocks a merge — the checks will run
# and report, and the merge button will stay green.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  data:
    name: registry generator + validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate the registry
        run: npm run build:data

      # The generator exiting 0 only proves it did not crash. These assert that
      # each validator still blocks the build it is supposed to block.
      - name: Prove the validators still block a bad build
        run: npm run test:data

      # The registry is a build artifact and is never hand-edited (contract,
      # rule 1). If a generated file differs from what is committed, someone
      # edited the JSON instead of the source.
      - name: Fail if the committed registry is stale or hand-edited
        run: |
          if [ -n "$(git status --porcelain -- out/ data/)" ]; then
            echo "::error::Generated data differs from what is committed."
            echo "The registry JSON is a build artifact. Edit the source and re-run 'npm run build:data'."
            git --no-pager diff -- out/ data/
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: esl-unit-registry
          path: out/
          retention-days: 14

  app:
    name: app build
    runs-on: ubuntu-latest
    needs: data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:data
      - run: npm run build
